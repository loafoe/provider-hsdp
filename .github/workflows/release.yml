name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.26'
  DOCKER_BUILDX_VERSION: 'v0.23.0'
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image name
        id: image
        run: echo "name=${{ env.REGISTRY }}/${{ github.repository_owner }}/provider-hsdp" >> "$GITHUB_OUTPUT"

      - name: Download Go modules
        run: make modules.download modules.check

      # Cross-compiles the provider binary for each platform and builds a
      # crossplane package (xpkg) per platform, embedding the corresponding
      # runtime image. This is the same flow used to publish provider-orgmapper.
      - name: Build provider package
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"

      - name: Push provider package
        run: |
          make publish.artifacts \
            XPKG_REG_ORGS=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            BRANCH_NAME=main \
            VERSION=${{ github.ref_name }}

      - name: Sign package image with cosign
        run: cosign sign --yes ${{ steps.image.outputs.name }}:${{ github.ref_name }}

      - name: Verify signature
        run: |
          cosign verify ${{ steps.image.outputs.name }}:${{ github.ref_name }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
