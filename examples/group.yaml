apiVersion: iam.hsdp.m.crossplane.io/v1
kind: Group
metadata:
  name: example-group
  namespace: crossplane-system
spec:
  providerConfigRef:
    name: default
  forProvider:
    name: example-group
    description: An example group
    managingOrganizationRef:
      name: example-org
    # roleRefs assigns each referenced Role's permissions to this Group's
    # members. Requires the referenced Role(s) to exist.
    roleRefs:
      - name: example-role
    # userRefs adds each referenced User as a member of this Group.
    userRefs:
      - name: example-user
    # userLogins adds existing HSDP users as members of this Group by login
    # ID (e.g. a username or email address), resolved to a GUID on every
    # reconcile. Use this instead of userRefs when you only know a user's
    # login and don't want Crossplane to own that User's full lifecycle
    # (creating/deleting a User resource for them).
    userLogins:
      - jsmith01
    # serviceRefs adds each referenced Service as a member of this Group.
    serviceRefs:
      - name: example-service
    # deviceRefs adds each referenced Device as a member of this Group.
    deviceRefs:
      - name: example-device
