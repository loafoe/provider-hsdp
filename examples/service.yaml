apiVersion: iam.hsdp.m.crossplane.io/v1
kind: Service
metadata:
  name: example-service
  namespace: crossplane-system
spec:
  providerConfigRef:
    name: default
  forProvider:
    name: example-service
    description: An example service identity
    applicationRef:
      name: example-application
    scopes:
      - openid
      - profile
    defaultScopes:
      - openid
    accessTokenLifetime: 3600
    refreshTokenLifetime: 86400
    tokenEndpointAuthMethod: private_key_jwt
    # Validity of the generated credentials, in months. Immutable.
    validity: 12
    # Bring your own certificate instead of a provider-generated key pair.
    # Mutually exclusive with privateKeySecretRef. Only applied at creation.
    # selfManagedCertificateSecretRef:
    #   name: example-service-certificate
    #   key: certificate
